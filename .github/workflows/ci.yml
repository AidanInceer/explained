name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check and tests (includes checks of every lesson file)
        run: npm run check
      - name: Build
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
