    <script>
      // On GitHub Pages, 404.html is a copy of this page and opens for every unknown address. An address under
      // develop/ belongs to the preview build: send it there with the path in "?p=", and put the path back here.
      ;(function (l, base) {
        var dev = base + 'develop/'
        var p = new URLSearchParams(l.search).get('p')
        if (p) history.replaceState(null, '', base + p.replace(/^\//, '') + l.hash)
        else if (base.slice(-9) !== '/develop/' && l.pathname.indexOf(dev) === 0 && l.pathname !== dev)
          l.replace(dev + '?p=' + encodeURIComponent(l.pathname.slice(dev.length)) + l.hash)
      })(location, '%BASE_URL%')
    </script>
